name: compliance

# Live governance state vs Terraform, read-only. Fails when any check finds drift:
# workspace domains, tenant settings, domain contributors, OneLake roles, labels / tags / endorsement.
# PRs check live state against the *deployed* policy (base-branch code), so a PR that changes the policy is not
# blocked by drift it will only fix once applied; the proposed policy is checked after terraform.yml applies it.
on:
  pull_request:
  workflow_run:
    workflows: [terraform]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily: catches portal changes made outside Terraform
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> Entra service principal
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }} # tools read `terraform output` from HCP state
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  compliance:
    name: compliance
    # Fork PRs get neither the HCP token nor an OIDC token; the job is skipped, which satisfies the required check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - uses: actions/setup-python@v6 # TRANSITION: only for base commits from before the package; remove next PR
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.1
      - name: terraform init
        run: |
          terraform -chdir=infra/terraform/governance init
          terraform -chdir=infra/terraform/domains init
      # if: !cancelled() runs every check, so one failure does not hide another
      - name: workspace domains
        if: ${{ !cancelled() }}
        run: if [ -f pyproject.toml ]; then uv run --locked workspace-domains; else python tools/workspace_domains.py; fi
      - name: tenant settings
        if: ${{ !cancelled() }}
        run: if [ -f pyproject.toml ]; then uv run --locked tenant-settings; else python tools/tenant_settings.py; fi
      - name: domain contributors
        if: ${{ !cancelled() }}
        run: if [ -f pyproject.toml ]; then uv run --locked domain-contributors; else python tools/domain_contributors.py; fi
      - name: OneLake roles
        if: ${{ !cancelled() }}
        run: if [ -f pyproject.toml ]; then uv run --locked onelake-roles; else python tools/onelake_roles.py; fi
      - name: labels, tags, endorsement
        if: ${{ !cancelled() }}
        run: if [ -f pyproject.toml ]; then uv run --locked data-product-governance; else python tools/data_product_governance.py; fi
