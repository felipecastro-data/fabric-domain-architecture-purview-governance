# Analytics · trips × weather data contract (ODCS v3.1). Checked daily by `data-contracts` (schema, row counts, lineage)
# and `data-freshness` (latency SLA). Scaffolded with `data-contracts --scaffold analytics`.
apiVersion: v3.1.0
kind: DataContract
id: urn:fabric-mesh:analytics
name: Analytics · trips × weather
version: 1.0.0
status: active
domain: analytics
dataProduct: lh_analytics
tenant: fabric-mesh
tags:
- data-product
- consumer-aligned
description:
  purpose: Consumer-aligned product combining the Mobility and Weather data products across domains.
  usage: Cross-domain analysis of demand against weather. Same tables and schemas as the producer contracts it re-exposes.
  limitations: 'Re-exposes producer tables through shortcuts: their schema, freshness and limitations apply.'
schema:
- name: agg_daily_kpis
  physicalName: agg_daily_kpis
  physicalType: table
  description: Daily trips and duration KPIs per member type, joined with that day's weather.
  properties:
  - name: date_key
    logicalType: integer
    physicalType: integer
    primaryKey: true
    primaryKeyPosition: 1
  - name: member_type
    logicalType: string
    physicalType: string
    primaryKey: true
    primaryKeyPosition: 2
  - name: trips
    logicalType: integer
    physicalType: long
  - name: total_duration_min
    logicalType: number
    physicalType: double
  - name: avg_duration_min
    logicalType: number
    physicalType: double
  - name: median_duration_min
    logicalType: number
    physicalType: double
  - name: avg_distance_km
    logicalType: number
    physicalType: double
  - name: electric_share
    logicalType: number
    physicalType: double
  - name: round_trip_share
    logicalType: number
    physicalType: double
  - name: dockless_share
    logicalType: number
    physicalType: double
  - name: condition
    logicalType: string
    physicalType: string
  - name: temperature_2m_mean
    logicalType: number
    physicalType: double
  - name: precipitation_sum
    logicalType: number
    physicalType: double
  - name: is_wet_day
    logicalType: boolean
    physicalType: boolean
  - name: trip_month
    logicalType: string
    physicalType: string
    partitioned: true
  quality:
  - name: not empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
  logicalType: object
- name: dim_date
  physicalName: dim_date
  physicalType: table
  description: Calendar with US holidays, one row per date.
  properties:
  - name: date_key
    logicalType: integer
    physicalType: integer
    primaryKey: true
    primaryKeyPosition: 1
  - name: date
    logicalType: date
    physicalType: date
  - name: year
    logicalType: integer
    physicalType: integer
  - name: quarter
    logicalType: integer
    physicalType: integer
  - name: month
    logicalType: integer
    physicalType: integer
  - name: month_name
    logicalType: string
    physicalType: string
  - name: period
    logicalType: string
    physicalType: string
  - name: day
    logicalType: integer
    physicalType: integer
  - name: day_of_week
    logicalType: integer
    physicalType: integer
  - name: day_name
    logicalType: string
    physicalType: string
  - name: iso_week
    logicalType: integer
    physicalType: integer
  - name: is_weekend
    logicalType: boolean
    physicalType: boolean
  - name: is_holiday
    logicalType: boolean
    physicalType: boolean
  - name: holiday_name
    logicalType: string
    physicalType: string
  quality:
  - name: not empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
  logicalType: object
- name: dim_station
  physicalName: dim_station
  physicalType: table
  description: 'Stations as SCD2 versions: a new version per rename or relocation.'
  properties:
  - name: station_version_key
    logicalType: integer
    physicalType: long
    primaryKey: true
    primaryKeyPosition: 1
  - name: station_key
    logicalType: integer
    physicalType: long
  - name: station_id
    logicalType: string
    physicalType: string
  - name: station_name
    logicalType: string
    physicalType: string
  - name: latitude
    logicalType: number
    physicalType: double
  - name: longitude
    logicalType: number
    physicalType: double
  - name: first_seen
    logicalType: date
    physicalType: date
  - name: last_seen
    logicalType: date
    physicalType: date
  - name: is_dockless
    logicalType: boolean
    physicalType: boolean
  - name: valid_from
    logicalType: timestamp
    physicalType: timestamp
  - name: valid_to
    logicalType: timestamp
    physicalType: timestamp
  - name: is_current
    logicalType: boolean
    physicalType: boolean
  - name: change_reason
    logicalType: string
    physicalType: string
  quality:
  - name: not empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
  logicalType: object
- name: dim_weather
  physicalName: dim_weather
  physicalType: table
  description: Daily Chicago weather from Open-Meteo, one row per date, with derived bands.
  properties:
  - name: date_key
    logicalType: integer
    physicalType: integer
    primaryKey: true
    primaryKeyPosition: 1
  - name: date
    logicalType: date
    physicalType: date
  - name: weather_code
    logicalType: integer
    physicalType: integer
  - name: condition
    logicalType: string
    physicalType: string
  - name: temperature_2m_max
    logicalType: number
    physicalType: double
  - name: temperature_2m_min
    logicalType: number
    physicalType: double
  - name: temperature_2m_mean
    logicalType: number
    physicalType: double
  - name: temperature_band
    logicalType: string
    physicalType: string
  - name: precipitation_sum
    logicalType: number
    physicalType: double
  - name: rain_sum
    logicalType: number
    physicalType: double
  - name: snowfall_sum
    logicalType: number
    physicalType: double
  - name: wind_speed_10m_max
    logicalType: number
    physicalType: double
  - name: is_wet_day
    logicalType: boolean
    physicalType: boolean
  quality:
  - name: not empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
  logicalType: object
- name: fact_trips
  physicalName: fact_trips
  physicalType: table
  description: 'One row per Divvy ride (deduplicated, quarantined rows removed). Ride-level: engineers only.'
  properties:
  - name: ride_id
    logicalType: string
    physicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    classification: confidential
  - name: date_key
    logicalType: integer
    physicalType: integer
  - name: start_hour
    logicalType: integer
    physicalType: integer
  - name: start_station_key
    logicalType: integer
    physicalType: long
    classification: confidential
  - name: end_station_key
    logicalType: integer
    physicalType: long
    classification: confidential
  - name: rideable_type
    logicalType: string
    physicalType: string
  - name: member_type
    logicalType: string
    physicalType: string
  - name: started_at
    logicalType: timestamp
    physicalType: timestamp
    classification: confidential
  - name: ended_at
    logicalType: timestamp
    physicalType: timestamp
    classification: confidential
  - name: duration_min
    logicalType: number
    physicalType: double
  - name: distance_km
    logicalType: number
    physicalType: double
  - name: is_round_trip
    logicalType: boolean
    physicalType: boolean
  - name: is_dockless
    logicalType: boolean
    physicalType: boolean
  - name: is_electric
    logicalType: boolean
    physicalType: boolean
  - name: _bronze_batch_id
    logicalType: string
    physicalType: string
  - name: _period
    logicalType: string
    physicalType: string
    partitioned: true
  quality:
  - name: not empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
  logicalType: object
team:
  name: Analytics domain
  members:
  - username: sg-mesh-analytics-owners
    role: owner
    description: Domain admins, workspace Admins
  - username: sg-mesh-analytics-engineers
    role: data engineer
    description: Workspace Contributors
roles:
- role: sg-mesh-analytics-consumers
  access: read
  description: dimensions and aggregates (fact_trips denied at the source)
- role: sg-mesh-analytics-engineers
  access: read
  description: every table
support:
- channel: github-issues
  url: https://github.com/felipecastro-data/fabric-domain-architecture-purview-governance/issues
slaProperties:
- property: latency
  value: 8
  unit: d
  driver: analytics
  description: 'Newest write across the product''s tables is at most 8 days old: the weekly prod schedule plus a day.'
  scheduler: cron
  schedule: 0 6 * * *
customProperties:
- property: sourceWorkspace
  value: divvy-medallion-prod
  description: Every table's shortcut chain must end here (lineage check).
- property: sensitivityLabel
  value: Confidential
  description: Purview label, enforced by data-product-governance.
- property: producedBy
  value: https://github.com/felipecastro-data/fabric-medallion-cicd-terraform
- property: upstreamContracts
  value:
  - mobility.yml
  - weather.yml
